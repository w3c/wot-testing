name: Validation

on:
  - pull_request

jobs:
  validate-tds:
    name: Validate TDs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wot-testing
        uses: actions/checkout@v4

      - name: Setup Node.js                         
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'

      - name: Create empty folder
        run: npm init -y
        
      - name: Install Playground CLI
        run: npm i @thing-description-playground/cli
        
      - name: Run validation script on all new matching files
        env:
          VALIDATION_SCRIPT: node_modules/@thing-description-playground/cli/index.js
        run: |
          # Get the list of changed files
          url="https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
          changed_files=$(curl -s -X GET -G $url | jq -r '.[] | if .status!="removed" then .filename else empty end')

          exit_code=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "===================="
            # Check the file extension — match both *.td.jsonld and *.td.json
            if [[ "$file" == *.td.jsonld || "$file" == *.td.json ]]; then

              # Look for .td-validation.json in the file's directory (walk up to repo root)
              td_version="1.1"
              search_dir=$(dirname "$file")
              while true; do
                if [[ -f "$search_dir/.td-validation.json" ]]; then
                  td_version=$(jq -r '.tdVersion // "1.1"' "$search_dir/.td-validation.json")
                  break
                fi
                if [[ "$search_dir" == "." || "$search_dir" == "/" ]]; then
                  break
                fi
                search_dir=$(dirname "$search_dir")
              done

              if [[ "$td_version" == "1.1" ]]; then
                echo "Validating (TD 1.1) $file ..."
                result=$(node "$VALIDATION_SCRIPT" -i "$file" -d)
                if [[ $result == *"'failed'"* ]]; then
                  echo "$result"
                  echo "::error::Validation failed ✗"
                  exit_code=1
                else
                  echo "$result"
                  echo "Validation passed ✓"
                fi
              elif [[ "$td_version" == "2.0" ]]; then
                echo "Skipping (TD 2.0 — no validator yet) $file"
              else
                echo "Skipping (unknown tdVersion: $td_version) $file"
              fi
            else
              echo "Skipped $file"
            fi
          done <<< "$changed_files"
          exit $exit_code
